<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>苍穹耳语无限无垠 — MIXTAPE NO.001</title>
<style>
  :root{
    --bg:#070708; --panel:#111114; --line:#26262b;
    --ink:#e6e6e6; --dim:#9a9a9a; --faint:#5a5a5a;
    --pink:#e8336d;
    --rainbow:linear-gradient(90deg,#e8336d 0 16.6%,#e8702d 16.6% 33.2%,#f0c029 33.2% 49.8%,#2db8a8 49.8% 66.4%,#3b6fd4 66.4% 83%,#7a4fd4 83% 100%);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    min-height:100vh;background:var(--bg);color:var(--ink);
    font:300 15px/1.5 "Bahnschrift","Segoe UI","Microsoft YaHei",sans-serif;
    display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px;
    background-image:radial-gradient(ellipse 80% 60% at 50% 115%,#121217 0%,transparent 60%);
    overflow-x:hidden;
  }
  h1{font-weight:300;font-size:12px;letter-spacing:.34em;color:var(--faint);text-align:center;margin-bottom:14px}
  h1 b{font-weight:600;color:var(--ink)}

  /* ═══════ 场景：盒子在左，卡座在右，磁带在里面飞 ═══════ */
  .scene{position:relative;width:min(960px,96vw);height:340px;margin-bottom:18px}

  /* ── 磁带盒 ── */
  .box{position:absolute;left:0;top:36px;width:330px;height:236px;perspective:900px;cursor:pointer}
  .box-back{position:absolute;inset:0;border-radius:12px;
    background:linear-gradient(160deg,#1a1b1f,#0d0e10 70%);
    box-shadow:inset 0 0 0 1px #2a2a30, inset 0 0 40px rgba(0,0,0,.7), 0 16px 40px rgba(0,0,0,.55);
    overflow:hidden}
  .box-print{position:absolute;inset:10px;border-radius:8px;overflow:hidden;
    background:#050505 url("assets/cover.png") no-repeat center 18%/88% auto;opacity:.92}
  .box-print::after{content:"苍穹耳语无限无垠";position:absolute;left:10px;bottom:8px;
    writing-mode:vertical-rl;font-family:"Microsoft YaHei",serif;font-weight:600;
    font-size:15px;letter-spacing:.34em;color:#e8e8e8;text-shadow:0 0 12px #000}
  .box-print::before{content:"MIXTAPE NO.001 · 2026";position:absolute;right:8px;top:8px;
    font-size:9px;letter-spacing:.24em;color:#bdbdbd;text-shadow:0 0 8px #000}
  /* 盒内放磁带的凹槽 */
  .box-slot{position:absolute;left:36px;top:96px;width:250px;height:60px;border-radius:8px;
    background:#08090b;box-shadow:inset 0 3px 10px rgba(0,0,0,.9)}
  /* 透明塑盖：铰链在左缘 */
  .lid{position:absolute;inset:0;transform-origin:left center;transform-style:preserve-3d;
    transition:transform .9s cubic-bezier(.55,.05,.35,1);
    border-radius:12px;
    background:linear-gradient(155deg,rgba(190,205,220,.16),rgba(120,140,160,.05) 55%,rgba(190,205,220,.11));
    box-shadow:inset 0 0 0 1px rgba(210,225,240,.28), inset 0 0 26px rgba(160,190,220,.08)}
  .lid::after{content:"";position:absolute;left:8%;top:10%;width:70%;height:34%;
    background:linear-gradient(105deg,rgba(255,255,255,.14),transparent 70%);
    border-radius:8px;transform:skewX(-16deg)}
  .box.open .lid{transform:rotateY(-118deg)}
  .box-tag{position:absolute;left:10px;top:-24px;font-size:10px;letter-spacing:.26em;color:var(--faint)}

  /* ── 卡座 ── */
  .deck{position:absolute;right:0;top:6px;width:440px;height:308px;border-radius:16px;
    background:linear-gradient(165deg,#191b1f,#0e0f12 65%);
    box-shadow:inset 0 0 0 1px #2a2a30, inset 0 1px 0 rgba(255,255,255,.05), 0 18px 46px rgba(0,0,0,.6);
    padding:16px 18px;cursor:default}
  .deck-tag{position:absolute;left:18px;top:-24px;font-size:10px;letter-spacing:.26em;color:var(--faint)}
  /* 带仓观察窗：磁带飞进这里 */
  .deck-win{position:relative;margin:2px auto 12px;width:352px;max-width:100%;height:142px;border-radius:12px;
    background:linear-gradient(175deg,#0c0c0e 0%,#080809 60%,#100d0a 100%);
    box-shadow:inset 0 4px 20px rgba(0,0,0,.95), inset 0 0 0 2px #060606, inset 0 0 0 3px #111114;
    overflow:hidden}
  .deck-win::before{content:"";position:absolute;inset:0;z-index:7;pointer-events:none;
    background:linear-gradient(160deg,rgba(200,220,240,.09),transparent 45%)}
  .deck-win .no-tape{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:10px;letter-spacing:.34em;color:#3c3c42;z-index:1}
  .deck-win .has-tape .no-tape{display:none}

  .lcd{background:#060b07;border:1px solid #1d2b22;border-radius:8px;padding:9px 14px;margin-bottom:12px;
    display:flex;align-items:center;justify-content:space-between;gap:10px}
  .lcd .l1{font:600 14px Consolas,monospace;color:#9dffb8;letter-spacing:.06em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .lcd .l2{font:300 14px Consolas,monospace;color:#7ddc9d;white-space:nowrap}
  .lcd .glyph{font-size:16px;min-width:30px;text-align:right;display:inline-block}

  .bar{position:relative;height:6px;background:#1b1b1f;border-radius:3px;cursor:pointer;margin-bottom:5px}
  .bar .fill{position:absolute;inset:0 auto 0 0;width:0%;background:var(--rainbow);border-radius:3px}
  .bar .ticks{position:absolute;inset:0;pointer-events:none}
  .bar .ticks i{position:absolute;top:-3px;bottom:-3px;width:1px;background:#3a3a40}
  .times{display:flex;justify-content:space-between;font:300 11px Consolas,monospace;color:var(--faint);letter-spacing:.12em;margin-bottom:12px}

  .keys{display:flex;gap:9px;justify-content:center;flex-wrap:wrap}
  button{font:inherit;color:var(--ink);background:#17171a;border:1px solid var(--line);border-radius:10px;
    cursor:pointer;transition:transform .06s,border-color .15s,background .15s;user-select:none}
  button:active{transform:translateY(2px)}
  .key{min-width:62px;padding:9px 12px;display:flex;flex-direction:column;align-items:center;gap:3px}
  .key .g{font-size:16px;line-height:1}
  .key .t{font-size:10px;letter-spacing:.2em;color:var(--dim)}
  .key.on{border-color:var(--pink);background:#1d1418;box-shadow:0 0 14px rgba(232,51,109,.25)}
  .key.on .t{color:var(--pink)}
  .key:disabled{opacity:.32;cursor:not-allowed}
  .vol{display:flex;align-items:center;gap:10px;justify-content:center;margin-top:12px;color:var(--faint);font-size:10px;letter-spacing:.22em}
  input[type=range]{-webkit-appearance:none;appearance:none;width:170px;height:4px;background:#2a2a2f;border-radius:2px;outline:none}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:#ddd;cursor:pointer}

  /* ── 磁带（自由的那个，飞来飞去） ── */
  .tape{position:absolute;width:300px;height:139px;z-index:6;
    transition:left 1.05s cubic-bezier(.55,.05,.3,1), top 1.05s cubic-bezier(.55,.05,.3,1),
               transform 1.05s cubic-bezier(.55,.05,.3,1);
    transform-origin:center center;cursor:pointer}
  .tape.hidden{opacity:0;pointer-events:none}
  .tape .inner{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .8s cubic-bezier(.6,.05,.3,1)}
  .tape.sideB .inner{transform:rotateY(180deg)}
  .tface{position:absolute;inset:0;backface-visibility:hidden;border-radius:9px;overflow:hidden;
    background-size:cover;background-position:center;
    box-shadow:0 12px 30px rgba(0,0,0,.6),0 0 0 1px #202024}
  .tface.a{background-image:url("assets/label-a.png")}
  .tface.b{background-image:url("assets/label-b.png");transform:rotateY(180deg)}
  .twin{position:absolute;left:27.1%;top:27.9%;width:45.8%;height:43.8%;border-radius:999px;
    background:linear-gradient(175deg,#101012 0%,#0a0908 60%,#14100c 100%);
    box-shadow:inset 0 4px 16px rgba(0,0,0,.9), inset 0 0 0 2px #050505;overflow:hidden}
  .twin::after{content:"";position:absolute;inset:0;border-radius:999px;
    background:linear-gradient(160deg,rgba(255,255,255,.10),transparent 42%);pointer-events:none}
  .reel{position:absolute;top:50%;width:26%;aspect-ratio:1;transform:translateY(-50%)}
  .reel.l{left:18%}.reel.r{right:18%}
  .reel svg{width:100%;height:100%;display:block}
  .hub{transform-origin:50% 50%}
  .tape.spin .hub{animation:rot 1.9s linear infinite}
  .tape.spin.fast .hub{animation-duration:.38s}
  @keyframes rot{to{transform:rotate(360deg)}}

  /* ── 右下角浮字 ── */
  .trkpop{position:fixed;right:26px;bottom:22px;display:flex;gap:10px;align-items:baseline;
    font-size:13px;letter-spacing:.15em;color:#b9bec6;opacity:0;transform:translateY(6px);
    transition:opacity 1.3s ease,transform 1.3s ease;pointer-events:none;text-shadow:0 1px 8px rgba(0,0,0,.8);z-index:9}
  .trkpop.show{opacity:.62;transform:none}
  .trkpop .tp-side{font-size:10px;font-weight:600;letter-spacing:.3em;color:#8a919b}
  .trkpop .tp-no{font-size:10px;color:#6d747e}

  .hint{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);
    font-size:10.5px;letter-spacing:.24em;color:#565c66;white-space:nowrap;z-index:9}

  @media (max-width:920px){
    .scene{height:auto;display:flex;flex-direction:column;align-items:center;gap:22px}
    .box,.deck{position:relative;left:auto;right:auto;top:auto}
    .box{width:min(330px,88vw);height:220px}
    .deck{width:min(440px,92vw);height:auto}
    .tape{position:fixed;z-index:8}
  }
</style>
</head>
<body>
<h1><b>苍穹耳语无限无垠</b> · MIXTAPE NO.001 · 2026 · 限量 1 张</h1>

<div class="scene" id="scene">
  <!-- 磁带盒 -->
  <div class="box" id="box">
    <div class="box-tag">磁带盒 / CASE</div>
    <div class="box-back">
      <div class="box-print"></div>
      <div class="box-slot"></div>
    </div>
    <div class="lid" id="lid"></div>
  </div>

  <!-- 卡座 -->
  <div class="deck" id="deck">
    <div class="deck-tag">卡座 / OHM TAPE · STEREO</div>
    <div class="deck-win" id="deckWin">
      <div class="no-tape" id="noTape">NO TAPE</div>
    </div>
    <div class="lcd">
      <span class="l1" id="lcd1">NO TAPE · 请取出磁带放入卡座</span>
      <span class="l2"><span id="lcd2">00:00 / --:--</span>&nbsp;<span class="glyph" id="lcdg">■</span></span>
    </div>
    <div class="bar" id="bar"><div class="fill" id="fill"></div><div class="ticks" id="ticks"></div></div>
    <div class="times"><span id="tCur">00:00</span><span id="tTot">--:--</span></div>
    <div class="keys">
      <button class="key" id="bRew" disabled><span class="g">◀◀</span><span class="t">倒带</span></button>
      <button class="key" id="bPlay" disabled><span class="g">▶</span><span class="t">播放</span></button>
      <button class="key" id="bFf" disabled><span class="g">▶▶</span><span class="t">快进</span></button>
      <button class="key" id="bStop" disabled><span class="g">■</span><span class="t">停止</span></button>
      <button class="key" id="bEject" disabled><span class="g">⏏</span><span class="t">弹出</span></button>
    </div>
    <div class="vol">VOLUME<input type="range" id="vol" min="0" max="100" value="90"></div>
  </div>

  <!-- 磁带（自由的） -->
  <div class="tape sideA" id="tape">
    <div class="inner">
      <div class="tface a">
        <div class="twin">
          <div class="reel l" id="reelL"></div>
          <div class="reel r" id="reelR"></div>
        </div>
      </div>
      <div class="tface b"><div class="twin"></div></div>
    </div>
  </div>
</div>

<div class="trkpop" id="trkpop">
  <span class="tp-side" id="tpSide">SIDE A</span>
  <span class="tp-no" id="tpNo">01</span>
  <span id="tpName">—</span>
</div>
<div class="hint" id="hint">点击磁带盒 · 打开盒盖</div>

<script>
/* ═══════ 曲目与实测分界（和磁带上的真实位置一致） ═══════ */
const SIDES = {
  A: { cn:'SIDE A', total:'28:46', approx:1739.9, src:'assets/A%20side.mp3',
       starts:[16.5, 250.5, 414.3, 628.7, 866.5, 1163.4, 1447.8],
       tracks:[['01','Floating in Space','3:54'],['02','Far','2:59'],['03','Baby Blue','3:34'],
               ['04','Creep','3:55'],['05','The Great Gig in the Sky','4:44'],
               ['06','My Time (lofi)','4:49'],['07','Obstacles','4:51']] },
  B: { cn:'SIDE B', total:'27:00', approx:1676.8, src:'assets/B%20side.mp3',
       starts:[0, 209.5, 558.5, 891.0, 1165.2, 1385.3],
       tracks:[['08','Timber Hearth','3:24'],['09','Weird Fishes','5:16'],['10','Blind Spots','5:26'],
               ['11','Never Meant','4:26'],['12','Field of Hopes and Dreams','3:35'],
               ['13','Skies Forever Blue','4:53']] },
};
const other = s => s === 'A' ? 'B' : 'A';
const trackAt = (s, t) => { const st = SIDES[s].starts; let i = 0; for (let k = 0; k < st.length; k++) if (t >= st[k] - .4) i = k; return i; };
const fmt = s => `${String(Math.floor(s/60)).padStart(2,'0')}:${String(Math.floor(s%60)).padStart(2,'0')}`;
const clamp = (v,a,b) => Math.min(b, Math.max(a, v));
const $ = id => document.getElementById(id);

/* ═══════ 机械音效 ═══════ */
const sfx = {};
for (const n of ['click','clack','open','stop']) { const a = new Audio(`assets/sfx/${n}.wav`); sfx[n] = a; }
const play = n => { try { const a = sfx[n].cloneNode(); a.volume = .75; a.play().catch(()=>{}); } catch {} };
const tick = () => play('click'), clack = () => play('clack');

/* ═══════ 状态 ═══════ */
const audio = new Audio(SIDES.A.src); audio.preload = 'auto'; audio.volume = .9;
let side = 'A', tapeOut = false, boxOpen = false, busy = false;
let playing = false, wind = null, lastTrk = -1;
const REW_SECONDS = 8.5;
const dur = () => { const d = audio.duration; return (isFinite(d) && d > 0) ? d : SIDES[side].approx; };

/* ═══════ 卷带 ═══════ */
function reelSVG() {
  return `<svg viewBox="0 0 100 100">
    <circle class="ring" cx="50" cy="50" r="46" fill="#241a12" stroke="#120d09"/>
    <g class="hub"><circle cx="50" cy="50" r="21" fill="#0d0d0d"/><circle cx="50" cy="50" r="19" fill="#e9e9e9"/>
    ${[0,60,120,180,240,300].map(a=>{const r=a*Math.PI/180;
      return `<circle cx="${50+15.5*Math.cos(r)}" cy="${50+15.5*Math.sin(r)}" r="3.6" fill="#0d0d0d"/>`}).join('')}
    <circle cx="50" cy="50" r="6.5" fill="#0d0d0d"/></g></svg>`;
}
$('reelL').innerHTML = reelSVG(); $('reelR').innerHTML = reelSVG();
const REEL = {
  L: { ring: document.querySelector('#reelL .ring'), box: $('reelL') },
  R: { ring: document.querySelector('#reelR .ring'), box: $('reelR') },
};
function setTape(p) {
  REEL.L.ring.setAttribute('r', (46 - 26*p).toFixed(1));
  REEL.R.ring.setAttribute('r', (20 + 26*p).toFixed(1));
}
function spinState(on, fast) {
  const t = $('tape');
  t.classList.toggle('spin', on);
  t.classList.toggle('fast', !!fast);
}

/* ═══════ 磁带的三个位置（锚点对齐，自动布局） ═══════ */
const tapeEl = $('tape');
function placeTape(where, scale, extraRotY = 0) {
  const sc = $('scene').getBoundingClientRect();
  const anchor = where === 'box' ? $('box').getBoundingClientRect()
               : where === 'deck' ? $('deckWin').getBoundingClientRect()
               : { left: sc.left + sc.width * .38, top: sc.top + sc.height * .52, width: 40, height: 40 };
  const s = scale, tw = 300 * s, th = 139 * s;
  tapeEl.style.left = (anchor.left - sc.left + anchor.width/2 - tw/2) + 'px';
  tapeEl.style.top  = (anchor.top - sc.top + anchor.height/2 - th/2) + 'px';
  const rotY = (side === 'B' ? 180 : 0) + extraRotY;
  tapeEl.style.transform = `scale(${s}) rotateY(${rotY}deg)`;
}
function placeNow(where, scale) {
  tapeEl.style.transition = 'none';
  placeTape(where, scale);
  requestAnimationFrame(() => tapeEl.style.transition = '');
}
addEventListener('resize', () => { if (!busy) placeNow(inserted ? 'deck' : (tapeOut ? 'out' : 'box'), inserted ? .82 : .8); });
let inserted = false;                                    // 磁带在卡座里

/* ═══════ 盒盖 ═══════ */
$('box').addEventListener('click', () => {
  if (inserted || busy) return;
  boxOpen = !boxOpen;
  $('box').classList.toggle('open', boxOpen);
  play(boxOpen ? 'open' : 'clack');
  if (boxOpen) { tapeEl.classList.remove('hidden'); placeNow('box', .8); hint('点击磁带 · 取出磁带'); }
  else if (!tapeOut) tapeEl.classList.add('hidden');
  else hint('点击磁带盒 · 打开盒盖');
});

/* ═══════ 点击磁带：取出 / 翻面 ═══════ */
tapeEl.addEventListener('click', (e) => {
  e.stopPropagation();
  if (busy) return;
  if (!boxOpen) { hint('先点击磁带盒打开盒盖'); return; }
  if (inserted) return;
  if (!tapeOut) { takeOut(); }
  else flipSide();
});
function takeOut() {
  busy = true;
  placeTape('out', .8);
  play('open');
  hint('点击卡座 · 放入磁带　　点击磁带 · 翻面 A/B');
  setTimeout(() => {
    tapeOut = true; busy = false;
    $('box').classList.remove('open'); boxOpen = false;
    placeTape('out', .8);
  }, 1000);
}

/* ═══════ 放入 / 弹出 ═══════ */
$('deck').addEventListener('click', (e) => {
  if (busy) return;
  if (tapeOut && !inserted) insertTape();
});
function insertTape() {
  if (inserted || busy || !tapeOut) return;
  busy = true; clack();
  placeTape('deck', .82);
  setTimeout(() => {
    inserted = true; busy = false;
    $('noTape').style.display = 'none';
    clack();
    setKeys(true);
    hint('SPACE 播放 · R 倒带 · T 快进 · S 停止 · ⏏ 弹出');
    lastTrk = -1;
    updateLCD(true);
    placeNow('deck', .82);
  }, 1050);
}
function ejectTape() {
  if (!inserted || busy) return;
  stopAll();
  busy = true; play('open');
  inserted = false;
  $('noTape').style.display = '';
  setKeys(false);
  placeTape('out', .8);
  setTimeout(() => { tapeOut = true; busy = false; clack();
    hint('点击磁带 · 翻面 A/B　　点击卡座 · 放入'); placeNow('out', .8); updateLCD(true); }, 1050);
}
function setKeys(on) {
  for (const id of ['bPlay','bStop','bRew','bFf','bEject']) $(id).disabled = !on;
}

/* ═══════ 走带 ═══════ */
function stopWind() {
  if (!wind) return;
  wind = null;
  $('bRew').classList.remove('on'); $('bFf').classList.remove('on');
  spinState(playing, false);
}
function togglePlay() {
  if (!inserted) return;
  if (wind) stopWind();
  playing = !playing;
  $('bPlay').classList.toggle('on', playing);
  $('bPlay').querySelector('.t').textContent = playing ? '暂停' : '播放';
  if (playing) {
    if (audio.ended || audio.currentTime > audio.duration - .08) audio.currentTime = 0;
    audio.play().catch(()=>{});
    tick();
  } else { audio.pause(); play('stop'); }
  spinState(playing, false);
  updateLCD();
}
function stopAll() {
  if (wind) stopWind();
  playing = false;
  $('bPlay').classList.remove('on');
  $('bPlay').querySelector('.t').textContent = '播放';
  audio.pause(); play('stop');
  spinState(false, false);
  updateLCD();
}
function setWind(w) {
  if (w === wind) w = null;
  wind = w; playing = false;
  $('bPlay').classList.remove('on');
  $('bPlay').querySelector('.t').textContent = '播放';
  audio.pause();
  $('bRew').classList.toggle('on', w === 'rew');
  $('bFf').classList.toggle('on', w === 'ff');
  spinState(true, !!w);
  tick();
}
/** 带尾：自动倒回带头并停 */
function endOfSide() {
  playing = false;
  $('bPlay').classList.remove('on');
  $('bPlay').querySelector('.t').textContent = '播放';
  audio.pause();
  wind = 'rew';
  $('bRew').classList.add('on');
  spinState(true, true);
  updateLCD();
}
let lastTs = performance.now();
function windLoop(ts) {
  const dt = Math.min((ts - lastTs) / 1000, .05); lastTs = ts;
  if (wind && inserted) {
    const step = (dur() / REW_SECONDS) * dt;
    if (wind === 'rew') {
      audio.currentTime = Math.max(0, audio.currentTime - step);
      if (audio.currentTime <= 0) { stopWind(); updateLCD(); }
    } else {
      audio.currentTime = Math.min(dur(), audio.currentTime + step);
      if (audio.currentTime >= dur() - .05) endOfSide();
    }
    updateLCD();
  }
  requestAnimationFrame(windLoop);
}
requestAnimationFrame(windLoop);
audio.addEventListener('ended', endOfSide);
audio.addEventListener('loadedmetadata', () => { buildTicks(); updateLCD(); });

/* ═══════ 翻面（真实物理：位置镜像映射） ═══════
   A、B 面共用同一条磁带的上下两半磁迹；翻面后位置镜像：
   t_new = dur_new × (1 − t_old/dur_old)。A 播完翻面 → B 从头开始。 */
function flipSide() {
  if (wind) stopWind();
  if (playing) { playing = false; audio.pause();
    $('bPlay').classList.remove('on'); $('bPlay').querySelector('.t').textContent = '播放'; }
  const frac = dur() ? clamp(audio.currentTime / dur(), 0, 1) : 0;
  side = other(side);
  tapeEl.classList.toggle('sideB', side === 'B');
  clack();
  audio.src = SIDES[side].src; audio.load();
  audio.addEventListener('loadedmetadata', () => {
    const at = audio.duration * (1 - frac);
    audio.currentTime = at;
    buildTicks(); updateLCD();
  }, { once: true });
  lastTrk = -1;
  hint(`翻到 ${SIDES[side].cn}　点击卡座 · 放入磁带`);
  setTimeout(updateLCD, 100);
}

/* ═══════ 读数 ═══════ */
function updateLCD(force) {
  const sd = SIDES[side], t = (inserted && audio.currentTime) || 0;
  const tr = sd.tracks[trackAt(side, t)];
  if (!inserted) {
    $('lcd1').textContent = `NO TAPE · ${sd.cn} 朝上`;
    $('lcd2').textContent = '00:00 / --:--';
    $('lcdg').textContent = '■';
    $('tTot').textContent = '--:--';
    return;
  }
  $('lcd1').textContent = `${sd.cn} · ${tr[0]} ${tr[1]}`;
  $('lcd2').textContent = `${fmt(t)} / ${sd.total}`;
  $('lcdg').textContent = wind === 'rew' ? '◀◀' : wind === 'ff' ? '▶▶' : playing ? '▶' : '■';
  $('tCur').textContent = fmt(t);
  $('tTot').textContent = sd.total;
  const p = clamp(t / dur(), 0, 1);
  $('fill').style.width = (p*100).toFixed(2) + '%';
  setTape(p);
}
function buildTicks() {
  const d = dur() || 1;
  $('ticks').innerHTML = SIDES[side].starts.slice(1).map(t0 =>
    `<i style="left:${(t0/d*100).toFixed(2)}%"></i>`).join('');
}

/* ═══════ 浮字 ═══════ */
let popTimer = 0;
function announce(sd, tr) {
  $('tpSide').textContent = sd.cn;
  $('tpNo').textContent = tr[0];
  $('tpName').textContent = tr[1];
  $('trkpop').classList.add('show');
  clearTimeout(popTimer);
  popTimer = setTimeout(() => $('trkpop').classList.remove('show'), 6500);
}

/* ═══════ 提示行 ═══════ */
let hintTimer = 0;
function hint(text) {
  $('hint').textContent = text;
  $('hint').style.opacity = '.9';
  clearTimeout(hintTimer);
  hintTimer = setTimeout(() => $('hint').style.opacity = '.35', 9000);
}

/* ═══════ 接线 ═══════ */
$('bPlay').addEventListener('click', e => { e.stopPropagation(); tick(); togglePlay(); });
$('bStop').addEventListener('click', e => { e.stopPropagation(); tick(); stopAll(); });
$('bRew').addEventListener('click', e => { e.stopPropagation(); setWind(wind === 'rew' ? null : 'rew'); });
$('bFf').addEventListener('click', e => { e.stopPropagation(); setWind(wind === 'ff' ? null : 'ff'); });
$('bEject').addEventListener('click', e => { e.stopPropagation(); tick(); ejectTape(); });
$('vol').addEventListener('input', e => audio.volume = e.target.value / 100);
$('bar').addEventListener('click', e => {
  if (!inserted) return;
  const r = e.currentTarget.getBoundingClientRect();
  if (dur()) audio.currentTime = clamp((e.clientX - r.left) / r.width, 0, 1) * dur();
  updateLCD();
});
$('deck').querySelectorAll('button').forEach(b => b.addEventListener('click', e => e.stopPropagation()));
addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (k === ' ') { e.preventDefault(); if (inserted) togglePlay(); }
  else if (k === 'r' && inserted) setWind(wind === 'rew' ? null : 'rew');
  else if (k === 't' && inserted) setWind(wind === 'ff' ? null : 'ff');
  else if (k === 's') stopAll();
  else if (k === 'e' && inserted) ejectTape();
  else if (k === 'f' && tapeOut && !inserted) flipSide();
});

/* ═══════ 节拍器 ═══════ */
setInterval(() => {
  updateLCD();
  if (inserted && playing && isFinite(audio.duration)) {
    const idx = trackAt(side, audio.currentTime);
    if (idx !== lastTrk) {
      lastTrk = idx;
      announce(SIDES[side], SIDES[side].tracks[idx]);
    }
  }
}, 250);

/* ═══════ 初始 ═══════ */
setTape(0);
buildTicks();
updateLCD();
tapeEl.classList.add('hidden');
requestAnimationFrame(() => placeNow('box', .8));
</script>
</body>
</html>
